name: Spellcheck
permissions:
  contents: read
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Spellcheck
        uses: rojopolis/spellcheck-github-actions@fcc5ca8351f0590978f238d6babfe3f28afc361f # 0.65.0
        with:
          config_path: .github/spellcheck-settings.yml
          task_name: Markdown
