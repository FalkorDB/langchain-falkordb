[project]
name = "langchain-falkordb-demo"
version = "0.1.0"
description = "Runnable demo for langchain-falkordb"
requires-python = ">=3.10,<4.0"
dependencies = [
  "langchain-falkordb",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
langchain-falkordb = { path = "..", develop = true }

[build-system]
requires = ["poetry-core>=2.2.0"]
build-backend = "poetry.core.masonry.api"
